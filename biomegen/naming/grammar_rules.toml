# Lore grammar (Tracery-style) for region descriptions.
#
# `_sentences` lists the top-level sentence symbols; the lore renderer samples 1-4 of them per region.
# Every other key is a symbol whose value is a list of templates. A template may contain #symbol#
# tokens, which are expanded recursively: if the token names another grammar symbol it expands to one
# of its templates; otherwise it is treated as a FACT and replaced by the value the lore stage bound
# (region_name, biome, size, culture_adj, settlement_phrase, water_phrase). Facts always have safe
# defaults, so no template ever leaves a raw #token# in the output.
#
# This file is the machine-readable source of truth; docs/GRAMMAR.md mirrors it with sample outputs.

[lore]
_sentences = ["overview", "settlement", "water", "flavour"]

overview = [
    "#region_name# is a #size# #biome#.",
    "The #size# #biome# of #region_name# spreads across the isle.",
    "#region_name#, a #culture_adj# #biome#, lies here.",
    "Maps mark #region_name# as a #size# #biome#.",
]

settlement = [
    "It is home to #settlement_phrase#.",
    "Within its bounds lie #settlement_phrase#.",
    "Travellers there find #settlement_phrase#.",
]

water = [
    "#water_phrase#",
]

flavour = [
    "Folk speak of it as a #culture_adj# land.",
    "It is reckoned a #culture_adj# place.",
    "There is something #culture_adj# about its reaches.",
]
