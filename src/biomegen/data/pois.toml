# POI kind table, keyed by kind. Loaded into the config tree as `tables.pois`; override with e.g. `[tables.pois.tower]`
# + `km2_per_poi = 900000.0` in a user config. Settlement kinds (capital, city, town, village) are tiers (tiers.toml);
# the kinds here are the wild and dynamic ones. A kind also needs a row in sites.toml to be zoomable and a marker in
# `render.markers`.
#
# Placement (the location pass of the pois stage), in `priority` order, lowest first:
#   priority          order of the passes; unique
#   source            where the kind comes from: "location" (placed by score), "history" (made from chronicle events) or
#                     "both"
#   km2_per_poi       one POI per this much land (sea, for on_water kinds) in km², times `poi.density`; omit for a
#                     kind the location pass never places
#   min_spacing_km    minimum distance to every POI placed before it
#   biomes            (optional) land cover it may stand on (lower-case Biome names); a kind without any is not placed
#   on_water          (optional) true for a kind that floats on open water
#   elevation_min_m, elevation_max_m   (optional) height band in metres
#   near_freshwater, coastal, remoteness   (optional) score weights favouring fresh water, the coast, distance from
#                     settlements
#   wild, seat_remoteness   (optional) score weights favouring wild land (no realm holds it) and distance from every
#                     realm's seat: bandit country
#   purpose           (optional) a camp's purpose (POI.purpose): its site row is `<kind>_<purpose>` in sites.toml
#   names             name patterns: `{n}` (a root made in the culture, exactly once) and `{fort}` (a fort word of it)
#   names_fallen      (optional) patterns for a fallen realm's capital ruin: `{fallen}` is the realm's name
#   hooks             (optional, needed by a kind placed by location) one-sentence story texts: `{name}` is the POI
#   hooks_near        (optional) texts that also name a settlement nearby (`{near}`), used only when one qualifies
#   floors            storeys: a count, or a [min, max] range drawn per POI (a dungeon descends, the rest rise)
#
# History (the rule table, pipeline/story/poi_rules.py): which chronicle events make the kind
#   events            (optional) event kinds that make this kind of POI
#   tags              (optional) tags an event must all carry
#   chance            (optional, default 1) the chance an event makes it
#   min_age_years     (optional) the event must be at least this old at the present
#   kind_spacing_km   (optional) minimum distance to another POI of the same kind
#   holdings          (optional) [min, max] extra POIs of the kind made with the first (a fallen realm's outlying ruins)
#   fated             (optional) true when each POI draws a fate from `poi_fates`
#   event_spacing_km  (optional) replaces min_spacing_km for a POI placed from an event, which stands near what it marks
#   offset_km         (optional) how far from the event's cell the POI may be placed (the nearest free cell that keeps
#                     the spacing wins)
#   holding_km        (optional) [min, max] km from the first POI, the band an extra (holding) POI is placed in
#   holding_spacing_km  (optional) minimum distance between a holding and any other POI
#   per_km_of_front   (optional) one POI per this many km of a war's front (rounded up) ...
#   max_per_event     (optional) ... at most this many

# Simulation seams (data only until a later simulation reads them):
#   owner             "realm" (held by the realm that owns its cell) or "wild"
#   dynamic           true when a later simulation mints and removes it
#   connect           true when the roads stage links it to the road network
#   bandit_strength   (optional) bandits it holds when it is wild and made with them
#   bandit_radius_km  (optional) how far its bandits' danger reaches
#   lifespan          (optional) years a dynamic POI stands before it is dismantled

[pois.tower]
priority = 10
source = "both"
events = ["fall"]
chance = 0.2
km2_per_poi = 1750000.0
min_spacing_km = 300.0
biomes = ["snow", "grass", "forest", "tundra"]
elevation_min_m = 300.0
remoteness = 0.5
wild = 0.8
seat_remoteness = 0.6
event_spacing_km = 50.0
offset_km = 150.0
floors = [4, 8]
owner = "wild"
dynamic = false
connect = true
bandit_strength = 50
bandit_radius_km = 120.0
names = ["{n} {fort}", "{fort} of {n}"]
hooks = ["{name} stands alone on the heights, and none will say who raised it.", "Bandits are said to keep {name}, and the road past it is not safe."]
hooks_near = ["{name} looks out over the lands round {near}.", "Travellers from {near} speak of {name} in lowered voices."]

[pois.dungeon]
priority = 20
source = "both"
events = ["fall"]
tags = ["conquered"]
chance = 0.2
km2_per_poi = 1750000.0
min_spacing_km = 300.0
biomes = ["snow", "forest", "tundra", "desert", "swamp"]
elevation_min_m = 100.0
remoteness = 0.7
wild = 1.0
seat_remoteness = 0.8
event_spacing_km = 50.0
offset_km = 150.0
floors = [3, 6]
owner = "wild"
dynamic = false
connect = true
bandit_strength = 80
bandit_radius_km = 150.0
names = ["{n} Depths", "{n} Catacombs", "Tomb of {n}", "{n} Deep"]
hooks = ["{name} lies deep under the hills; those who go down seldom return.", "Whatever was buried at {name} was buried to stay."]
hooks_near = ["Folk of {near} warn their children away from {name}.", "{name}, a day from {near}, has swallowed more than one hunting party."]

[pois.ruin]
priority = 30
source = "both"
events = ["fall"]
holdings = [0, 2]
fated = true
holding_km = [30.0, 150.0]
holding_spacing_km = 80.0
km2_per_poi = 1400000.0
min_spacing_km = 350.0
biomes = ["grass", "forest", "desert", "savanna", "tundra", "jungle"]
remoteness = 0.6
floors = 1
owner = "wild"
dynamic = false
connect = true
bandit_strength = 20
bandit_radius_km = 60.0
names = ["Ruins of {n}", "{n} Ruins", "Old {n}"]
names_fallen = ["Ruins of {fallen}", "Remains of {fallen}"]
hooks = ["{name} is all that is left of a people no one remembers.", "Grass grows through the broken floors of {name}."]
hooks_near = ["The shepherds of {near} avoid {name} after dark.", "{name} was a proud place once; now {near} takes its stones for walls."]

[pois.camp]
priority = 40
source = "location"
purpose = "bandit"
km2_per_poi = 1200000.0
min_spacing_km = 250.0
biomes = ["grass", "forest", "tundra", "savanna", "taiga"]
remoteness = 0.3
floors = 1
owner = "wild"
dynamic = true
connect = false
names = ["{n} Camp", "{n} Hollow", "{n} Rest"]
hooks = ["The fire at {name} is never quite out.", "{name} is a rough camp where the road bends."]
hooks_near = ["Drovers from {near} rest at {name}.", "{name} is a camp a few days from {near}, and nothing is asked of its guests."]

[pois.boat]
priority = 50
source = "location"
km2_per_poi = 2200000.0
min_spacing_km = 350.0
biomes = ["shallow", "deep", "lake"]
on_water = true
floors = 1
owner = "wild"
dynamic = false
connect = false
names = ["The {n}", "{n}"]
hooks = ["{name} drifts here, her crew minding their own business.", "{name} rides at anchor, and her cargo is nobody's concern."]

# Made by history only (no km2_per_poi): the location pass never places them.
[pois.battlefield]
priority = 60
source = "history"
events = ["battle"]
tags = ["decisive"]
chance = 0.25
min_age_years = 30
offset_km = 120.0
biomes = ["desert", "savanna", "grass", "forest", "jungle", "swamp", "taiga", "tundra", "snow"]
min_spacing_km = 40.0
kind_spacing_km = 250.0
floors = 1
owner = "wild"
dynamic = false
connect = false
names = ["{n} Field", "Field of {n}", "{n} Moor"]

[pois.watchtower]
priority = 70
source = "history"
events = ["war"]
tags = ["ongoing"]
per_km_of_front = 300.0
max_per_event = 3
biomes = ["desert", "savanna", "grass", "forest", "jungle", "swamp", "taiga", "tundra", "snow"]
min_spacing_km = 60.0
kind_spacing_km = 120.0
floors = [2, 3]
owner = "realm"
dynamic = true
lifespan = 150
connect = true
names = ["{n} Watch", "Watch of {n}", "{n} {fort}"]

# The site of a shrine comes from `poi_sites` (a row's `connect` replaces this one).
[pois.shrine]
priority = 80
source = "history"
events = ["succession"]
tags = ["to:pious"]
biomes = ["desert", "savanna", "grass", "forest", "jungle", "swamp", "taiga", "tundra", "snow"]
min_spacing_km = 40.0
floors = 1
owner = "realm"
dynamic = true
connect = true
names = ["{n} Shrine", "Shrine of {n}", "{n} Chapel"]

# What becomes of a fallen realm's ruins (a `fated` kind draws one per POI). `sim_only` fates are returned only to a later
# simulation (`poi_for_event(..., simulated=True)`): generation cannot show them, the living realms being final.
#   weight     relative chance among the fates open to the caller
#   sim_only   true when generation never draws it
#   bandits    true when the POI holds bandits (the kind's `bandit_strength`)
[poi_fates.ruin]
weight = 3.0
sim_only = false
bandits = false

[poi_fates.bandit]
weight = 1.0
sim_only = false
bandits = true

[poi_fates.captured]
weight = 1.0
sim_only = true
bandits = false

[poi_fates.successor]
weight = 1.0
sim_only = true
bandits = false

# Where a kind with several sites is built; the previous ruler's `temper` (rulers.toml) picks the row.
#   kind                the pois.toml kind
#   temper              "aggressive" or "passive"
#   land                "realm" (cells of the realm that builds it) or "any" (any land)
#   min_km, max_km      distance band from the realm's seat
#   connect             true when the roads stage links it
#   near_freshwater, remoteness   score weights for the cell inside the band
[poi_sites.shrine_near_seat]
kind = "shrine"
temper = "aggressive"
land = "realm"
min_km = 25.0
max_km = 150.0
connect = true
near_freshwater = 1.0
remoteness = 0.5

[poi_sites.shrine_wild]
kind = "shrine"
temper = "passive"
land = "any"
min_km = 150.0
max_km = 450.0
connect = false
near_freshwater = 0.5
remoteness = 1.0
