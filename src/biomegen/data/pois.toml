# What becomes of a fallen realm's ruins (a `fated` kind draws one per POI). `sim_only` fates are returned only to a later
# simulation (`poi_for_event(..., simulated=True)`): generation cannot show them, the living realms being final.
#   weight     relative chance among the fates open to the caller
#   sim_only   true when generation never draws it
#   bandits    true when the POI holds bandits (the kind's `bandit_strength`)
[poi_fates.ruin]
weight = 3.0
sim_only = false
bandits = false

[poi_fates.bandit]
weight = 1.0
sim_only = false
bandits = true

[poi_fates.captured]
weight = 1.0
sim_only = true
bandits = false

[poi_fates.successor]
weight = 1.0
sim_only = true
bandits = false

# What becomes of a free settlement (a civilized POI no realm holds, `POI.free`). Data only: a later simulation draws one on a
# settlement's own check; generation reads none of it (these are state changes, not answers to an event, so no rule of
# the event table uses them). Every fate is `sim_only`.
#   weight     relative chance of the fate before the factors tilt it
#   sim_only   true: generation never draws it
#   factors    the quantities the simulation reads to tilt the chance (documented names, not keys of this file):
#              proximity (to a faction), relations, prosperity, size, leader, remoteness, weak_control, danger
[free_fates.join]
weight = 3.0
sim_only = true
factors = ["proximity", "relations", "prosperity"]

[free_fates.found]
weight = 1.0
sim_only = true
factors = ["size", "leader", "remoteness"]

[free_fates.bandit]
weight = 1.0
sim_only = true
factors = ["weak_control", "danger", "remoteness"]

# Where a kind with several sites is built; the previous ruler's `temper` (rulers.toml) picks the row.
#   kind                the pois.toml kind
#   temper              "aggressive" or "passive"
#   land                "realm" (cells of the realm that builds it) or "any" (any land)
#   min_km, max_km      distance band from the realm's seat
#   connect             true when the roads stage links it
#   near_freshwater, remoteness   score weights for the cell inside the band
[poi_sites.shrine_near_seat]
kind = "shrine"
temper = "aggressive"
land = "realm"
min_km = 25.0
max_km = 150.0
connect = true
near_freshwater = 1.0
remoteness = 0.5

[poi_sites.shrine_wild]
kind = "shrine"
temper = "passive"
land = "any"
min_km = 150.0
max_km = 450.0
connect = false
near_freshwater = 0.5
remoteness = 1.0

# The styles of a homestead (and, for a style that grows, of a hamlet). A farm weights fertility over a settlement's closeness (a far,
