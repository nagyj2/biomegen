[pois.boat]
priority = 50
source = "location"
km2_per_poi = 2200000.0
min_spacing_km = 350.0
biomes = ["shallow", "deep", "lake"]
on_water = true
floors = 1
owner = "wild"
dynamic = false
connect = false
