# Site table, keyed by POI kind. Loaded into the config tree as `tables.sites`; override with e.g.
# `[tables.sites.village]` + `extent_tiles = [1.5, 1.0]` in a user config.
#
# A site is what you see when you zoom into a POI: a plan drawn on the terrain around its anchor. Settlement kinds
# (capital, city, town, village) match the rows of tiers.toml; the wild kinds match `poi.types`.
#
# Keys:
#   layout           which layout builds the plan: settlement, dungeon, tower, ruin, camp or boat
#   extent_tiles     [width, height] of the site in world tiles, centred on the anchor; below 1 is a site smaller
#                    than one tile, above 1 spans several tiles
#   rows_per_tile    plan cells per tile, vertically; columns per tile are this times render.cell_aspect, so a
#                    tile stays square on a terminal whose cells are taller than wide
#   grows_with_pop   true when a settlement's extent scales with its population inside the tier's range
#   plaza_tiles      (optional) radius of a settlement's central plaza in tiles

[sites.capital]
layout = "settlement"
extent_tiles = [3.0, 2.0]
rows_per_tile = 14
grows_with_pop = true
plaza_tiles = 0.5

[sites.city]
layout = "settlement"
extent_tiles = [2.0, 1.5]
rows_per_tile = 14
grows_with_pop = true
plaza_tiles = 0.4

[sites.town]
layout = "settlement"
extent_tiles = [1.5, 1.0]
rows_per_tile = 14
grows_with_pop = true
plaza_tiles = 0.3

[sites.village]
layout = "settlement"
extent_tiles = [1.0, 0.75]
rows_per_tile = 16
grows_with_pop = true
plaza_tiles = 0.2

[sites.tower]
layout = "tower"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.dungeon]
layout = "dungeon"
extent_tiles = [1.5, 1.0]
rows_per_tile = 18
grows_with_pop = false

[sites.ruin]
layout = "ruin"
extent_tiles = [1.0, 0.75]
rows_per_tile = 16
grows_with_pop = false

[sites.camp]
layout = "camp"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.boat]
layout = "boat"
extent_tiles = [0.4, 0.2]
rows_per_tile = 40
grows_with_pop = false
