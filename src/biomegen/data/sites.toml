# Site table, keyed by POI kind. Loaded into the config tree as `tables.sites`; override with e.g.
# `[tables.sites.village]` + `extent_tiles = [1.5, 1.0]` in a user config.
#
# A site is what you see when you zoom into a POI: a plan drawn on the terrain around its anchor. Settlement kinds
# (capital, city, town, village) match the rows of tiers.toml; the wild kinds match `poi.types`.
#
# Keys:
#   layout           which layout builds the plan: settlement, dungeon, tower, ruin, shrine, battlefield, camp or boat
#   furniture        the furniture family (data/furniture.toml) its rooms are dressed from, by role
#   extent_tiles     [width, height] of the site in world tiles, centred on the anchor; below 1 is a site smaller
#                    than one tile, above 1 spans several tiles
#   rows_per_tile    plan cells per tile, vertically; columns per tile are this times render.cell_aspect, so a
#                    tile stays square on a terminal whose cells are taller than wide
#   grows_with_pop   true when a settlement's extent scales with its population inside the tier's range
#   plaza_tiles      (optional) radius of a settlement's central plaza in tiles
#   walled           (optional) true when a settlement has a wall with a gate where each road arrives
#   ruin_standing    [young, old] share of a ruined settlement's buildings that still stand, just fallen and once old
#                    (`sites.ruin_erosion_years`); at least one building always stands
#   ruin_wall_fall   [young, old] share of a ruined settlement's wall that has fallen; its gates are always breached
#   ruin_extent_share  factor on the extent of a ruin that was this tier, so a big ruin does not overlap its neighbours
#                    (1 draws it as the settlement was). All three are needed by every tier a ruin may have been
#                    (tables.pois.ruin origins); tuned by eye
#   dress            (optional) a homestead row's dressing: farm, mill, mine, lodge or fishery (see `sites.homestead.dress`)

[sites.capital]
furniture = "home"
layout = "settlement"
extent_tiles = [3.5, 2.5]
rows_per_tile = 24
grows_with_pop = true
plaza_tiles = 0.25
walled = true
ruin_standing = [0.5, 0.1]
ruin_wall_fall = [0.3, 0.7]
ruin_extent_share = 0.5

