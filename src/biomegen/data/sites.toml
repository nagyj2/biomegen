# Site table, keyed by POI kind. Loaded into the config tree as `tables.sites`; override with e.g.
# `[tables.sites.village]` + `extent_tiles = [1.5, 1.0]` in a user config.
#
# A site is what you see when you zoom into a POI: a plan drawn on the terrain around its anchor. Settlement kinds
# (capital, city, town, village) match the rows of tiers.toml; the wild kinds match `poi.types`.
#
# Keys:
#   layout           which layout builds the plan: settlement, dungeon, tower, ruin, shrine, battlefield, camp or boat
#   furniture        the furniture family (data/furniture.toml) its rooms are dressed from, by role
#   extent_tiles     [width, height] of the site in world tiles, centred on the anchor; below 1 is a site smaller
#                    than one tile, above 1 spans several tiles
#   rows_per_tile    plan cells per tile, vertically; columns per tile are this times render.cell_aspect, so a
#                    tile stays square on a terminal whose cells are taller than wide
#   grows_with_pop   true when a settlement's extent scales with its population inside the tier's range
#   plaza_tiles      (optional) radius of a settlement's central plaza in tiles
#   walled           (optional) true when a settlement has a wall with a gate where each road arrives

[sites.capital]
furniture = "home"
layout = "settlement"
extent_tiles = [3.5, 2.5]
rows_per_tile = 24
grows_with_pop = true
plaza_tiles = 0.25
walled = true

[sites.city]
furniture = "home"
layout = "settlement"
extent_tiles = [2.5, 2.0]
rows_per_tile = 24
grows_with_pop = true
plaza_tiles = 0.18
walled = true

[sites.town]
furniture = "home"
layout = "settlement"
extent_tiles = [2.0, 1.5]
rows_per_tile = 22
grows_with_pop = true
plaza_tiles = 0.12

[sites.village]
furniture = "home"
layout = "settlement"
extent_tiles = [1.5, 1.25]
rows_per_tile = 20
grows_with_pop = true
plaza_tiles = 0.08

[sites.tower]
furniture = "tower"
layout = "tower"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.dungeon]
furniture = "dungeon"
layout = "dungeon"
extent_tiles = [1.5, 1.0]
rows_per_tile = 18
grows_with_pop = false

[sites.ruin]
furniture = "ruin"
layout = "ruin"
extent_tiles = [1.5, 1.0]
rows_per_tile = 16
grows_with_pop = false

[sites.camp]
furniture = "camp"
layout = "camp"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.boat]
furniture = "boat"
layout = "boat"
extent_tiles = [0.4, 0.2]
rows_per_tile = 40
grows_with_pop = false

# A hamlet is a few houses round a lane, smaller than a village.
[sites.hamlet]
furniture = "home"
layout = "settlement"
extent_tiles = [1.0, 0.8]
rows_per_tile = 20
grows_with_pop = true
plaza_tiles = 0.05

# A camp's look follows its `purpose` (POI.purpose): a site row named `camp_<purpose>` replaces the plain `camp` row.
# Founding camps are a builders' yard, bandit camps the rough tents the camp row always drew, army camps a banner camp.
[sites.camp_founding]
furniture = "camp_founding"
layout = "camp"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.camp_bandit]
furniture = "camp"
layout = "camp"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.camp_army]
furniture = "camp_army"
layout = "camp"
extent_tiles = [0.7, 0.6]
rows_per_tile = 24
grows_with_pop = false

# A battlefield is an open trampled field, a watchtower a small tower in its own furniture, a shrine one walled room.
[sites.battlefield]
furniture = "battlefield"
layout = "battlefield"
extent_tiles = [2.6, 1.8]
rows_per_tile = 16
grows_with_pop = false

[sites.watchtower]
furniture = "watchtower"
layout = "tower"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.shrine]
furniture = "shrine"
layout = "shrine"
extent_tiles = [0.6, 0.5]
rows_per_tile = 24
grows_with_pop = false
