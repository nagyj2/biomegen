# A camp's look follows its `purpose` (POI.purpose): a site row named `camp_<purpose>` replaces the plain `camp` row.
# Founding camps are a builders' yard, bandit camps the rough tents the camp row always drew, army camps a banner camp.
[sites.camp_founding]
furniture = "camp_founding"
layout = "camp"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

[sites.camp_bandit]
furniture = "camp"
layout = "camp"
extent_tiles = [0.5, 0.5]
rows_per_tile = 24
grows_with_pop = false

