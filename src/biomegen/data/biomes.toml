# Biome and relief attribute tables, keyed by the lower-case enum member name.
#
# Loaded into the config tree as `tables.biomes` and `tables.relief`; a user config overrides any
# attribute with e.g. `[tables.biomes.desert]` + `goods = "glass"` (deep-merged, like every section).
# Adding a biome is an enum entry in world/tile.py plus a row here with every key.
# Rows follow the reference generator (docs/reference/worldgen.py).
#
# Biome keys:
#   label         display name
#   glyph, ascii  map glyph (one character) for unicode and ASCII output
#   fg, bg        glyph and background colour, [r, g, b] or "#rrggbb"
#   water         true for water surfaces (not walkable, never settled)
#   sparse        true when the terrain glyph is scattered rather than drawn on every cell
#   habitability  0..1 settlement suitability before relief
#   move_cost     road / travel cost per cell on flat land, >= 1 (ignored for water)
#   goods         trade good the biome is known for ("" for none)
#   resource      the `resources.toml` row (food, wood, ...) the biome's land yields, "" for none; `goods` is its name
#   priority      how salient the biome is when a fit-to-screen map shows one tile per block of tiles
#                 (higher wins; POIs and roads have their own priorities in render.fit_priority)

[biomes.deep]
label = "Deep ocean"
glyph = " "
ascii = " "
fg = [40, 70, 130]
bg = [12, 30, 70]
water = true
sparse = false
habitability = 0.0
move_cost = 1.0
goods = "pearls"
resource = "luxury"
priority = 5

