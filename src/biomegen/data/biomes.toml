# Relief keys (one row per Relief enum member):
#   label             display name
#   glyph, ascii      overlay glyph ("" draws the biome glyph instead)
#   fg                overlay glyph colour
#   habitability_mul  0..1 multiplier on the biome's habitability
#   move_cost         extra cost per cell added to the biome's move_cost, >= 0
#   goods             trade good of the high ground ("" uses the biome's)
#   resource          the `resources.toml` row the high ground yields instead of the biome's, "" to keep the biome's
#   priority          fit-to-screen salience of the high ground (a tile shows the larger of its biome's and its
#                     relief's priority)
#   min_elevation_m   optional: land at least this high gets this relief (the highest matching row
#                     wins); rows without it (none, volcano) are never chosen by height

[relief.none]
label = "Flat"
glyph = ""
ascii = ""
fg = [0, 0, 0]
habitability_mul = 1.0
move_cost = 0.0
goods = ""
resource = ""
priority = 0

[relief.hills]
label = "Hills"
glyph = "∩"
ascii = "n"
fg = [70, 60, 36]
habitability_mul = 0.7
move_cost = 2.0
goods = "building stone"
resource = "stone"
priority = 0
min_elevation_m = 800.0

[relief.mountain]
