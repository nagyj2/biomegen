# Settlement tier table, keyed by tier name. Loaded into the config tree as `tables.tiers`; override
# with e.g. `[tables.tiers.town]` + `spacing_km = 200.0` in a user config.
#
# Distances and areas are km / km². They started as the reference generator's column-based values converted
# at its 201-column, 6000 km default (29.85 km per column); phase 5 re-tuned them and a later pass widened the
# spacing of cities, towns and villages and thinned the towns and villages (the map felt crowded).
#
# Keys:
#   label         display name
#   rank          placement order, 0 first (capitals before cities ...); unique
#   glyph, ascii  map marker (one character) for unicode and ASCII output
#   fg            marker colour, [r, g, b] or "#rrggbb"
#   bg            optional marker background colour (omit to keep the terrain background)
#   pop           [min, max] population
#   floors        [min, max] storeys of the settlement's tallest buildings (its site has this many floors)
#   spacing_km    minimum distance to any already-placed settlement
#   land_per_settlement_km2  one settlement of this tier per this much land area (km²)
#   backbone      true when roads join this tier into the trunk network; false tiers branch off it as spurs

[tiers.capital]
label = "Capital"
rank = 0
glyph = "Ω"
ascii = "@"
fg = [255, 215, 40]
bg = [110, 20, 20]
pop = [40000, 160000]
floors = [3, 4]
spacing_km = 480.0
land_per_settlement_km2 = 750000.0
backbone = true

[tiers.city]
label = "City"
rank = 1
glyph = "●"
ascii = "O"
fg = [255, 245, 200]
bg = [60, 40, 30]
pop = [9000, 40000]
floors = [2, 3]
spacing_km = 420.0
land_per_settlement_km2 = 800000.0
backbone = true

[tiers.town]
label = "Town"
rank = 2
glyph = "○"
ascii = "o"
fg = [250, 240, 220]
pop = [1500, 8000]
floors = [1, 2]
spacing_km = 300.0
land_per_settlement_km2 = 480000.0
backbone = true

[tiers.village]
label = "Village"
rank = 3
glyph = "•"
ascii = "+"
fg = [245, 235, 215]
pop = [80, 1200]
floors = [1, 1]
spacing_km = 230.0
land_per_settlement_km2 = 300000.0
backbone = false
