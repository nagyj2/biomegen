# Settlement tier table, keyed by tier name. Loaded into the config tree as `tables.tiers`; override
# with e.g. `[tables.tiers.town]` + `spacing_km = 200.0` in a user config.
#
# Distances and areas are km / km². They started as the reference generator's column-based values converted
# at its 201-column, 6000 km default (29.85 km per column); phase 5 re-tuned them and a later pass widened the
# spacing of cities, towns and villages and thinned the towns and villages (the map felt crowded).
#
# Keys:
#   label         display name
#   rank          placement order, 0 first (capitals before cities ...); unique
#   glyph, ascii  map marker (one character) for unicode and ASCII output
#   fg            marker colour, [r, g, b] or "#rrggbb"
#   bg            optional marker background colour (omit to keep the terrain background)
#   pop           [min, max] population
#   floors        [min, max] storeys of the settlement's tallest buildings (its site has this many floors)
#   spacing_km    minimum distance to any already-placed settlement
#   land_per_settlement_km2  one settlement of this tier per this much land area (km²)
#   backbone      true when roads join this tier into the trunk network; false tiers branch off it as spurs
#   dynamic       (optional, default false) true for a tier a later simulation mints: the settlements stage places none
#   connect       (optional, default true) false for a tier the roads stage does not link
#   map_marker    (optional, default true) false to hide the marker at the map scale (it still shows at the zoom scale)
#   free_fg       (optional) marker colour of a settlement no realm holds (a free settlement); omit to keep `fg`
#   hooks_free    (optional) one-sentence story texts of a free settlement: `{name}` is the settlement
#   hooks_remnant (optional) texts of a free settlement that is a remnant of a fallen realm: `{name}` and `{fallen}` (needed)
#   near_target   (optional, default true) false for a tier too small to count as a settlement of note: other places' texts never
#                 name it as the settlement nearby and the legend leaves it out of a realm's settlement count (the hamlet)

[tiers.capital]
label = "Capital"
rank = 0
glyph = "Ω"
ascii = "@"
fg = [255, 215, 40]
bg = [110, 20, 20]
pop = [40000, 160000]
floors = [3, 4]
spacing_km = 480.0
land_per_settlement_km2 = 750000.0
backbone = true

[tiers.city]
label = "City"
rank = 1
glyph = "●"
ascii = "O"
fg = [255, 245, 200]
bg = [60, 40, 30]
pop = [9000, 40000]
floors = [2, 3]
spacing_km = 420.0
land_per_settlement_km2 = 800000.0
backbone = true
free_fg = [150, 200, 205]
hooks_free = ["{name} answers to no crown, and its council means to keep it so.", "No banner flies over {name}; the great houses of the city keep the peace themselves.", "Neither king nor emperor claims {name}, though many have wished to."]
hooks_remnant = ["{name} outlived the fall of {fallen} and still keeps the old customs.", "When {fallen} fell, {name} stayed on, and nobody came to rule it.", "{name} is a remnant of {fallen}; its walls remember a crown that is gone."]

[tiers.town]
label = "Town"
rank = 2
glyph = "○"
ascii = "o"
fg = [250, 240, 220]
pop = [1500, 8000]
floors = [1, 2]
spacing_km = 300.0
land_per_settlement_km2 = 480000.0
backbone = true
free_fg = [150, 200, 205]
hooks_free = ["{name} answers to no crown, and its people like it so.", "No banner flies over {name}; its elders settle matters themselves.", "Neither king nor council claims {name}."]
hooks_remnant = ["{name} outlived the fall of {fallen} and has gone its own way since.", "When {fallen} fell, {name} stayed on without a lord.", "The market of {name} is all that is left of the days of {fallen}."]

[tiers.village]
label = "Village"
rank = 3
glyph = "•"
ascii = "+"
fg = [245, 235, 215]
pop = [80, 1200]
floors = [1, 1]
spacing_km = 230.0
land_per_settlement_km2 = 300000.0
backbone = false
free_fg = [150, 200, 205]
hooks_free = ["{name} answers to no lord and pays tribute to none.", "No tax collector has come to {name} in living memory.", "The people of {name} keep their own laws."]
hooks_remnant = ["{name} outlived the fall of {fallen}; its people still tell of the old rulers.", "When {fallen} fell, the people of {name} simply carried on.", "{name} is a remnant of {fallen}, forgotten by everyone but itself."]

# A hamlet is minted by a later simulation, never placed by the settlements stage (`dynamic`), and roads do not link it
# (`connect = false`). Its marker is hidden on the map and drawn from the zoom scale down (`map_marker = false`).
[tiers.hamlet]
label = "Hamlet"
rank = 4
glyph = "·"
ascii = "."
fg = [235, 225, 205]
pop = [10, 80]
floors = [1, 1]
spacing_km = 120.0
land_per_settlement_km2 = 150000.0
backbone = false
dynamic = true
connect = false
map_marker = false
near_target = false
free_fg = [150, 200, 205]
hooks_free = ["{name} is a handful of houses that answer to no one.", "No one has ever claimed {name}; it is too small to be worth the trouble."]
