# Furniture, keyed by family and then by room role. Loaded into the config tree as `tables.furniture`; a site row names
# a family (`furniture` in sites.toml) and its layout asks for a role per room. Each key under a role is a furniture
# cell (a lower-case `Cell` name in world/tile.py) and each value its relative weight: weights need not sum to anything.
# A user override can reweight one item, e.g. `[tables.furniture.dungeon.vault]` + `chest = 20.0`.
#
# Roles a layout uses: homes `hall` (the largest room), `kitchen`, `bedroom`, `storage`; dungeons `hall`, `cell`, `vault`,
# `passage` (corridors: rubble only); towers `study`, `bedroom`, `storage`, `lookout`; ruins `hall`, `debris`; boats
# `deck`, `cabin`; camps `supplies`; battlefields `debris`; shrines `altar`; watchtowers the tower roles. A role that is missing leaves its rooms bare.
# Dungeons add depth-scaled chest weight to every role that has `chest` (sites.furnish.chest_depth_gain).

[furniture.home.hall]
table = 14.0
chair = 14.0
hearth = 10.0
shelf = 8.0
chest = 3.0

[furniture.home.kitchen]
