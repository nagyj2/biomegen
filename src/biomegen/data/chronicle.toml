# Wording of the chronicle's events, loaded into the config tree as `tables.chronicle`. The history stage picks a
# template per event (seeded) and the naming stage fills its tokens once every realm, place and fallen realm has a
# name. Override one row with e.g. `[tables.chronicle.war]` + `templates = [...]` in a user config.
#
# chronicle, one row per kind of event text (founding, founding_fallen, settling, expansion, expansion_fallen,
# creation_tower, creation_dungeon, road_trunk, road_spur, conquest, succession, war, war_ended, war_fallen, rivalry,
# treaty_alliance, treaty_trade, battle, peace, fall, fall_conquered):
#   templates       sentences to pick from; they never name a nearby place
#   templates_near  optional; sentences that name a nearby settlement with {near}. An event draws from these as well
#                   only when a settlement of the same landmass lies within `history.near_km`; each must contain {near}
#
# Tokens ({year}, the year of the event, is allowed in every sentence):
#   founding          {realm} {short} {ruler} {seat}              the new realm, its short name, its ruler, its seat
#   settling          {realm} {short} {town}                      the realm and the city it settled
#   expansion         {realm} {short} {ruler} {seat}              a realm annexing a wide stretch of wild land
#   expansion_fallen  {fallen}                                    a fallen realm doing the same
#   creation_tower    {place}                                     a tower raised (minor event)
#   creation_dungeon  {place}                                     a dungeon delved (minor event)
#   creation_watchtower {place}                                   a watchtower raised when a war begins (minor event)
#   abandon_watchtower, dismantle_watchtower {place}              a watchtower left empty / torn down at the peace (minor)
#   occupation_tower  {place}                                     bandits take an abandoned watchtower (minor)
#   road_trunk        {a} {b}                                     a road laid between two places (minor event)
#   road_spur         {a}                                         a track cut from a place to the road (minor event)
#   founding_predecessor  {predecessor}                           a realm that later ended in a clean split (see below)
#   settling_free     {town}                                      a city or town no realm holds
#   settling_remnant  {town} {fallen}                             a free settlement founded in the life of a fallen realm
#   conquest          {realm} {short} {liege} {liege_short} {ruler}   the vassal, its overlord and the overlord's ruler
#   war               {attacker} {attacker_short} {defender} {defender_short} {reason} {town}
#   rivalry           {a} {a_short} {b} {b_short} {reason}
#   treaty_alliance   {a} {a_short} {b} {b_short} {reason}
#   treaty_trade      {a} {a_short} {b} {b_short} {reason}
#   battle            {winner} {winner_short} {loser} {loser_short} {reason}
#   fall              {fallen} {founded}                          the fallen realm's name and its founding year
#   succession        {realm} {short} {style} {old_style} {ruler} {old_ruler}   the realm, its new and old ruling styles
#                                                                 and the rulers of the new and the old reign
#   founding_fallen   {fallen}
#   war_ended         {attacker} {attacker_short} {defender} {defender_short}   an older war, over by now
#   war_fallen        {attacker} {attacker_short} {defender} {defender_short} {fallen}   a war with a fallen realm
#                     (its name stands for both the name and the short name)
#   peace             {winner} {winner_short} {loser} {loser_short}   the end of an older war
#   fall_conquered    {fallen} {founded} {victor} {victor_short}   a fallen realm conquered by a living one
# {reason} is the wording of the relation (data/reasons.toml); {town} the claimed town of the war.

[chronicle.founding]
templates = [
  "{realm} is founded under {ruler}.",
  "{ruler} unites the clans and raises {realm}.",
  "{short} rises as a power, ruled by {ruler}.",
  "{realm} is proclaimed in {seat}.",
]
templates_near = [
  "{realm} is founded at {seat}, a few days' ride from {near}.",
]

[chronicle.settling]
templates = [
  "{short} settles {town}.",
  "The settlers of {realm} found {town}.",
  "{town} grows from a camp into a lasting settlement.",
]
templates_near = [
  "{town} is settled in the lands near {near}.",
]

[chronicle.founding_predecessor]
templates = [
  "{predecessor} is founded.",
  "{predecessor} rises as a power.",
  "{predecessor} is proclaimed, and its banners are raised over the land.",
]

[chronicle.settling_free]
templates = [
  "{town} is raised on land no crown claims.",
  "Settlers found {town}, and it answers to no lord.",
  "{town} grows up on its own, belonging to no realm.",
]

[chronicle.settling_remnant]
templates = [
  "Settlers of {fallen} found {town}.",
  "{town} is raised in the days of {fallen}.",
  "Under {fallen}, {town} grows from a camp into a lasting settlement.",
]

[chronicle.conquest]
templates = [
  "{liege} subdues {realm}; its lords kneel to {ruler}.",
  "{short} swears fealty to {liege_short}.",
  "{realm} falls under the rule of {liege}.",
]

[chronicle.succession]
templates = [
  "The throne of {short} passes to {ruler}, a {style} ruler, after {old_ruler}'s {old_style} reign.",
  "{ruler}, a {style} ruler, succeeds {old_ruler} to the rule of {realm}; the {old_style} days are over.",
  "{short} changes with its ruler: {old_ruler}'s {old_style} reign gives way to {ruler}'s {style} one.",
]

[chronicle.war]
templates = [
  "{attacker} marches on {defender} over {reason}.",
  "War breaks out between {attacker_short} and {defender_short}: {reason}.",
  "{attacker_short} declares war on {defender_short}, citing {reason}.",
]

[chronicle.rivalry]
templates = [
  "{a_short} and {b_short} fall into rivalry: {reason}.",
  "Relations between {a} and {b} sour: {reason}.",
]

[chronicle.treaty_alliance]
templates = [
  "{a_short} and {b_short} swear an alliance, {reason}.",
  "A pact is sealed between {a} and {b}: {reason}.",
]

[chronicle.treaty_trade]
templates = [
  "{a_short} and {b_short} open their markets: {reason}.",
  "A trade pact is struck between {a} and {b}: {reason}.",
]

[chronicle.battle]
templates = [
  "{winner_short} defeats {loser_short} in a bloody battle on the border.",
  "The host of {winner_short} breaks the army of {loser_short}.",
  "A battle on the frontier ends in victory for {winner_short}.",
]
templates_near = [
  "{winner_short} routs {loser_short} in a battle fought near {near}.",
  "The fields near {near} run red as {winner_short} defeats {loser_short}.",
]

[chronicle.fall]
templates = [
  "{fallen}, founded in {founded}, falls and is forgotten.",
  "{fallen} collapses; its halls are left to the wild.",
  "The last ruler of {fallen} dies and the realm dissolves.",
]
templates_near = [
  "{fallen} falls; its ruins crumble in the wilds near {near}.",
]

[chronicle.founding_fallen]
templates = [
  "{fallen} is founded.",
  "{fallen} rises in the wilds, far from the great powers.",
  "A new realm, {fallen}, is proclaimed.",
]
templates_near = [
  "{fallen} is founded in the lands near {near}.",
]

[chronicle.war_ended]
templates = [
  "{attacker_short} goes to war with {defender_short}.",
  "{attacker} and {defender} come to blows over the borderlands.",
  "{attacker_short} sends its host against {defender_short}.",
]

[chronicle.war_fallen]
templates = [
  "{attacker} marches on {defender}.",
  "{attacker} and {defender} go to war.",
  "{attacker} raids the lands of {defender}.",
]

[chronicle.peace]
templates = [
  "{loser_short} sues for peace; {winner_short} keeps the border it won.",
  "The war ends in victory for {winner_short}; {loser_short} yields ground.",
  "{winner_short} and {loser_short} make peace, with the border redrawn in {winner_short}'s favour.",
]

[chronicle.fall_conquered]
templates = [
  "{victor} conquers {fallen}, founded in {founded}, and its name is forgotten.",
  "{fallen} is broken by {victor_short} and falls.",
  "After its defeats, {fallen} falls to {victor}.",
]
templates_near = [
  "{victor_short} conquers {fallen}; its ruins lie near {near}.",
]

# A secession is worded by its form and by how bitter the break was (the relation between the two sides, data/secession.toml).
# Tokens: an offshoot {realm} {short} {parent} {parent_short} {ruler} {seat} (the new realm, the realm it left, the new
# ruler, the new capital); a split {predecessor} and, for each of the two new realms, {realm_a} {short_a} {ruler_a} and
# {realm_b} {short_b} {ruler_b}; a defection {town} {realm} {short} {parent} {parent_short} (the settlement, the realm it
# joins, the realm it leaves).

[chronicle.secession_offshoot_bitter]
templates = [
  "{realm} breaks from {parent} under {ruler}, taking {seat} for its capital.",
  "{ruler} raises the banner of revolt at {seat}; {short} will not kneel to {parent_short} again.",
  "{short} tears itself loose from {parent_short}.",
]

[chronicle.secession_offshoot_amicable]
templates = [
  "{ruler} and {parent} part as friends: {realm} is founded at {seat}.",
  "{parent_short} lets {short} go; {realm} takes {seat} for its capital under {ruler}.",
  "By agreement, {seat} and its lands leave {parent_short} to form {realm}.",
]

[chronicle.secession_split_bitter]
templates = [
  "{predecessor} is torn apart: {realm_a} under {ruler_a} and {realm_b} under {ruler_b} rise from its ruins.",
  "{predecessor} breaks in civil war into {short_a} and {short_b}.",
]

[chronicle.secession_split_amicable]
templates = [
  "{predecessor} is divided by agreement between {realm_a}, ruled by {ruler_a}, and {realm_b}, ruled by {ruler_b}.",
  "The heirs of {predecessor} part ways: {short_a} under {ruler_a}, {short_b} under {ruler_b}.",
]

[chronicle.secession_defection_bitter]
templates = [
  "{town} renounces {parent} and swears to {realm}.",
  "The people of {town} throw out the officers of {parent_short} and open their gates to {short}.",
]

[chronicle.secession_defection_amicable]
templates = [
  "{town} leaves {parent} for {realm} by a vote of its elders.",
  "{short} is welcomed in {town}, which leaves the rule of {parent_short} without bloodshed.",
]

[chronicle.expansion]
templates = [
  "{realm} claims the wild lands about its borders.",
  "{short} spreads its rule over a wide stretch of open land.",
  "Under {ruler}, {short} settles and holds the lands beyond its marches.",
  "{short} raises its banners over land no realm held.",
]
templates_near = [
  "{short} pushes its borders out from {near} and claims the open lands beyond.",
]

[chronicle.expansion_fallen]
templates = [
  "{fallen} spreads over the wild lands about it.",
  "{fallen} claims a wide stretch of open land.",
]

# A tower or dungeon made (a minor event, kept in the annals: the viewer shows minor events on request). {place} is its name.

[chronicle.creation_tower]
templates = [
  "{place} is raised on the heights.",
  "Builders raise {place}.",
  "{place} is built, and its keep looks out over the land.",
]
templates_near = [
  "{place} is raised on the heights above {near}.",
]

[chronicle.creation_dungeon]
templates = [
  "{place} is delved into the earth.",
  "Diggers break open the depths of {place}.",
  "{place} is dug deep under the hills.",
]
templates_near = [
  "{place} is delved beneath the lands near {near}.",
]

# A road laid (a minor event). road_trunk joins two places ({a} and {b}); road_spur runs from {a} to the nearest road.

[chronicle.road_trunk]
templates = [
  "A road is laid between {a} and {b}.",
  "{a} and {b} are joined by a road.",
  "Carts begin to travel the new road from {a} to {b}.",
]

[chronicle.road_spur]
templates = [
  "A track is cut from {a} to the road.",
  "{a} is joined to the road by a new track.",
]

# The life of a watchtower (minor events, kept in the annals). {place} is its name. creation_watchtower: raised when its war
# was declared; abandon_watchtower: left standing at the peace; dismantle_watchtower: torn down at the peace;
# occupation_tower: bandits take an abandoned one, and it is a tower from then on.

[chronicle.creation_watchtower]
templates = [
  "{place} is raised behind the front.",
  "A watchtower, {place}, goes up as the war begins.",
  "Soldiers raise {place} to watch the border.",
]

[chronicle.abandon_watchtower]
templates = [
  "{place} is left empty when the war ends.",
  "With peace made, {place} is abandoned.",
]

[chronicle.dismantle_watchtower]
templates = [
  "{place} is torn down now the war is over.",
  "With peace made, {place} is pulled down.",
]

[chronicle.occupation_tower]
templates = [
  "Bandits take the empty watchtower of {place}.",
  "{place}, long abandoned, is claimed by bandits and becomes their tower.",
]
