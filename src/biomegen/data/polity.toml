# Political tables, loaded into the config tree as `tables.realm_kinds`, `tables.realm_forms`,
# `tables.relation_weights` and `tables.realm_colors`; override one attribute of a row with e.g.
# `[tables.realm_kinds.tribal]` + `strength = [0.5, 0.8]`. Rows follow the reference generator
# (docs/reference/worldgen.py `_realms` and `_diplomacy`). Counts, budgets and distances (km) are in the
# `politics` config section, not here.
#
# realm_kinds, one row per kind in world/entities.py REALM_KINDS (major, city_state, tribal):
#   label            display name of the kind ("realm", "city-state", ...)
#   strength         [min, max] claim strength: a realm's cost to expand a step is divided by it
#   rural_per_km2    [min, max] people per km2 of land outside settlements
#   vassal_chance    chance that the realm swears fealty to a neighbouring major (needs one)
#
# realm_forms, one row per way a realm may be named and ruled:
#   kind      the realm kind that may use the form (a realm_kinds row)
#   habitat   "any", or the habitat that favours it: dry, cold, wood, high; "open" is the fallback for a
#             realm of no habitat. A realm picks among its kind's "any" rows and the rows of its habitats;
#             when none match it uses the "any" and "open" rows
#   weight    relative chance of the form among the candidates
#   form      the realm's full name; {n} is a made-up base name, {s} the seat's name
#   rulers    ruler styles to pick from; {p} is a made-up personal name, {n} the base name
#
# relation_weights, one row per kind of neighbour pair (major_pair: both majors; other_pair: any other):
#   war, rivalry, alliance, trade, none   relative chance of each outcome for a pair sharing a border
#
# realm_colors, one row per colour role (major, vassal, city_state, tribal), in HSV:
#   saturation, value   0..1
#   hue_jitter          vassals vary their liege's hue by up to this much (0..1 of the hue circle)
#   hue_offset          hue shift of the role against the golden-ratio sequence (0..1)

[realm_kinds.major]
label = "realm"
strength = [0.6, 1.4]
rural_per_km2 = [2.0, 6.0]
vassal_chance = 0.35

[realm_kinds.city_state]
label = "city-state"
strength = [0.3, 0.45]
rural_per_km2 = [3.0, 8.0]
vassal_chance = 0.5

[realm_kinds.tribal]
label = "tribal lands"
strength = [0.45, 0.7]
rural_per_km2 = [0.03, 0.15]
vassal_chance = 0.35

[realm_forms.kingdom]
