# biomegen example configuration.
#
# This file is a SPARSE OVERLAY: every key has a built-in default (see biomegen/config/defaults.py),
# so you only need to include the keys you want to change. Delete anything you are happy to leave at
# its default. Run with:  python main.py --config config.example.toml

[general]
seed = 0              # 0 = pick a random seed and print it (so the run is still reproducible)

[world]
width = 192           # tiles; default fits a ~209-wide terminal at 1:1
height = 44           # tiles; default leaves room for the status panel on a 58-line terminal
sea_level = 0.40      # normalised elevation below which tiles are ocean/water
size_mode = "fixed"   # "fixed" (reproducible) or "auto" (fit to current terminal)
scale_x = 1.0         # global per-axis generation scale (>1 stretches features along X)
scale_y = 1.0

[compute]
backend = "scipy"     # "scipy" | "numpy" | "pure"

[terrain]
noise_backend = "perlin"   # "perlin" | "value" | "opensimplex" | "noise_lib"
octaves = 7
persistence = 0.54
lacunarity = 2.0
scale = 58.0
warp_strength = 0.55       # higher => more meandering coastlines and ridges
falloff_power = 2.2        # lower => broader/larger main island; higher => smaller with more sea ring
land_floor = 0.18          # gentle interior lift so the main island is solid + a touch larger
coast_detail = 0.42        # ragged coastlines: peninsulas, bays, gulfs, channels (0 = smooth/round)
coast_scale = 20.0
archipelago = 0.42         # small satellite islands around the dominant main island (0 = single)
archipelago_scale = 68.0
redistribution = 1.0

[climate]
orientation = "equator-center"   # or "north-pole-top"
lapse_rate = 0.55
moisture_redistribution = 1.5    # >1 => drier map (more desert/savanna/grassland, less forest/jungle)
coastal_bias = 0.10

[hydrology]
flow_model = "d8"                # "d8" | "dinf"
accumulation_threshold = 55
min_lake_size = 5
river_width_scale = 0.5          # how fast rivers widen with drainage area
river_max_width = 5              # widest a great river can get (tiles)

[biomes]
classifier = "whittaker"
beach_max = 0.45
mountain_min = 0.76
snow_min = 0.88

[regions]
min_region_size = 12
color_jitter = 28

[poi]
sampler = "bluenoise"            # "bluenoise" | "random" | "grid"

# Per-kind rules live under [poi.types.<kind>]; only overrides shown here (see defaults.py for all).
[poi.types.dungeon]
avoid_water = true              # reject anchors whose footprint would clip ocean/lake/river water

[interiors]
partition = "bsp"               # room layout: "bsp" | "tcod_bsp"
cells_per_tile = 6              # canonical interior resolution (detail cells per world tile)
room_min = 4                    # min/max room side in interior cells
room_max = 10
clutter_density = 0.10          # fraction of free interior cells furnished (rubble/barrels/chests)
size_jitter = 0.4               # per-POI footprint size variation (0 disables): structures spawn larger/smaller
shape = "mixed"                 # dungeon outline: rectangle|blob|cellular|drunkard|diamond|cross|mixed
                                # ("mixed" picks an organic shape per dungeon so none is square)
# Per-kind interior footprint in WORLD TILES (w, h), centred on the anchor. Only kinds with a
# registered builder render an interior (Phase 5 implements "dungeon"); the rest stay map markers.
[interiors.footprints]
dungeon = [6, 4]
tower = [3, 3]
city = [7, 5]
town = [5, 4]
village = [4, 3]
ruins = [4, 3]
camp = [3, 3]
boat = [3, 2]

[roads]
pathfinder = "astar"            # "astar" | "tcod" | "dijkstra"
civilized_connect_prob = 0.9
uncivilized_connect_prob = 0.25
meander_strength = 0.30
bridges = true                  # place a bridge POI where a road must cross a river (Phase 4)

[render]
zoom_scale = 5                  # ZOOM (mid) scale: detail-cell height per biome tile (aspect-corrected)
local_rows = 5                  # LOCAL (close) scale: ~this many biome tiles fill the screen height
cell_aspect = 2.0               # widen detail cells so a world tile reads ~square (both detail scales)
blend_strength = 0.85           # soften biome boundaries at detail scales (0 = crisp grid)
blend_scale = 2.5               # feature size (tiles) of the boundary-blend warp
default_view = "fit"            # "fit" | "onetoone"
status_height = 12
try_truecolor = true

[export]
dir = "./images"
cell_px = 12
png = true

[keys]
zoom = " "                # step OUT a zoom level (biome<->zoom, local->zoom)
local = "z"               # step IN a zoom level (biome->zoom->local). Set to " " only if your
                          # terminal distinguishes Shift+Space (most do not)
toggle_scale = "f"
floor_up = "<"             # cycle up a floor when standing on a multi-floor structure (e.g. dungeon)
floor_down = ">"           # cycle down a floor
refresh = "r"              # regenerate the world with a fresh random seed
export_view = "e"
export_world = "E"
quit = "q"

[controls]
fast_step = 8             # tiles moved per Shift+arrow (or capital WASD/HJKL)
