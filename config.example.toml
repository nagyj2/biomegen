# biomegen example configuration.
#
# This file is a SPARSE OVERLAY: every key has a built-in default (see src/biomegen/config/defaults/),
# so you only need to include the keys you want to change. Delete anything you are happy to leave at
# its default. Run with:  uv run biomegen --config config.example.toml

[general]
seed = 0              # 0 = pick a random seed and print it (so the run is still reproducible)

[world]
width = 240           # tiles; with size_km 6000x3000 a cell is 25x50 km (2:1, like a terminal cell)
height = 60           # tiles; keep height = width * size_km[1] / size_km[0] / 2 for undistorted maps
size_mode = "fixed"   # "fixed" (reproducible) or "auto" (fit to current terminal)
size_km = [6000.0, 3000.0]   # physical map extent [east-west, north-south] in km
center_lat = "seed"   # map-centre latitude in degrees (north positive; clamped to keep edges within +-89),
                      # or "seed" to pick one per seed in center_lat_range_deg
center_lat_range_deg = [18.0, 48.0]   # [min, max] absolute latitude used by center_lat = "seed"
center_lon = 0.0      # map-centre longitude in degrees (east positive)

[compute]
backend = "scipy"     # "scipy" | "numpy" | "pure"

[terrain]
noise_backend = "perlin"   # "perlin" | "value" | "opensimplex" | "noise_lib"
style = "seed"             # "continents" | "pangaea" | "archipelago" | "islands" (tables.styles), or "seed"
land_fraction_jitter = 0.04   # +- per-seed jitter on the style's land fraction
max_elevation_m = [4300.0, 7400.0]   # [min, max] height of the highest summit

[climate]
offset_c = 0.0                   # warm (+) or cool (-) the whole world, °C
lapse_c_per_km = 6.5             # temperature drop per km of height

[hydrology]
river_land_share = 0.035         # share of land cells with the largest catchments that become river
river_min_drainage_km2 = 5000.0  # ...but only where the weighted catchment is at least this big
min_lake_area_km2 = 3000.0       # smaller depressions are not lakes
river_width_scale = 0.5          # how fast rivers widen with drainage area
river_max_width = 5              # widest a great river can get (tiles)

[biomes]
# Land bands by temperature (see src/biomegen/config/defaults/biomes.py for the full list), e.g.
# bands = [{ max_temp_c = -9.0, rain = [], biome = "snow", swamp = false }, ...]
swamp_min_rain_mm = 3000.0       # very wet lowland below swamp_max_elevation_m becomes swamp
beach_max_elevation_m = 150.0    # warm land touching the sea below this height is beach
shallow_km = 75.0                # sea within this distance of land is shallows

[geography]
min_landmass_km2 = 140000.0      # smaller islands get a landmass_id but no landmass feature
max_named_rivers = 5             # the largest rivers (at least min_river_km long) become features
min_river_km = 150.0

[politics]
city_state_far_km = 540.0        # a city this far from every capital is likely a city-state (realm kinds: data/polity.toml)
tribe_max = 6                    # tribes claiming the largest unclaimed areas
claim_budget_km = 1500.0         # how far (cost in km) a realm of strength 1 reaches over flat land
reason_near_km = 250.0           # a war or rivalry names a river, range or sea only this near the border

[history]
start = "present"                # "dawn": year 0, nothing settled, no chronicle (only a few ruins, towers and dungeons stand)
span_years = 1200                # the present year of a "present" world (event wording: data/chronicle.toml)
battles_per_100km_front = 0.1    # battles fought along a war's border, per 100 km of it
fallen_realms_per_million_km2 = 1.0   # vanished realms whose ruins lie on wild land
near_km = 250.0                  # a place named in an event is a settlement at most this far away
months_per_year = 12             # events and territory changes carry a month 1 to this
# Territory (who held which land, found by walking back from today's map): see history.territory in
# src/biomegen/config/defaults/history.py (expansions, expansion_share, core_share, fallen_area_km2, strips).

[settlements]
density = 1.0                    # multiplies every tier's settlement count (tiers: data/tiers.toml)
pop_scale = 1.5                  # multiplies every population drawn from the tables (1.0 = the table numbers); the map is unchanged
capital_min_landmass_km2 = 400000.0
max_capitals = 16

[poi]
density = 1.0                    # multiplies every wild POI kind's count (one per km2_per_poi)
min_footprint_land = 0.5        # min dry-land fraction of the tiles a wild POI's site covers for an eligible anchor

# Per-kind rules are the rows of [tables.pois.<kind>] (src/biomegen/data/pois.toml).

[sites]
size_jitter = 0.25              # each site's extent is scaled by a seeded factor in [1 - jitter, 1 + jitter]
margin_tiles = 0.5              # terrain kept round the extent in the site view
max_gates = 3                   # road gates cut into a site's edge
room_rows = [3, 6]              # room height range in rows (widths are widened by render.cell_aspect)
street_gap = [1, 1]             # clear ground [columns, rows] kept round each settlement building
clutter_density = 0.10          # fraction of free floor cells furnished
shape = "mixed"                 # solid-building outline: rectangle|blob|cellular|drunkard|diamond|cross|mixed
ruin_erosion = 0.45             # fraction of a ruin's walls that have collapsed once it is old (ruin_erosion_young when new)
ruin_damage = { breaches = 6.0, crack = 0.6, strip = 0.85, roof = 0.8 }  # how hard a ruin damages a building that survives, at full wear
ruin_rubble = { wall = 0.8, floor = 0.45 }  # shares of a destroyed building left as rubble (the rest is bare ground)
kinds = { radius_km = { fertility = 60.0, forest = 60.0, roughness = 150.0, fresh_water = 60.0, coast = 60.0 }, saturate = { fertility = 0.6, forest = 0.5, roughness = 0.25, fresh_water = 0.04, coast = 0.08 } }  # what a settlement is chosen to have
potential = { radius_km = 150.0, room_share = 1.0 }  # the tier a site could grow into: land within radius_km, room = share of a tier's spacing
coast_margin_rows = 1           # bare ground kept between a solid structure and any water
bridge_max_rows = 6             # the widest water a settlement street will bridge
# Per-kind site rows (layout, extent in tiles, plan resolution, furniture set) live in
# src/biomegen/data/sites.toml; furniture weights in furniture.toml; building kinds (sizes, roofs, what suits them) in buildings.toml and
# dressings (field variants, ruin wear) in dress.toml. Override one with e.g.
# [tables.sites.village] extent_tiles = [1.5, 1.0]

[roads]
pathfinder = "astar"            # "astar" | "tcod" | "dijkstra"
civilized_connect_prob = 0.9
uncivilized_connect_prob = 0.25
cardinal_only = false           # true routes every road north, east, south or west only (one box-drawing glyph set)
meander_strength = 0.30

[render]
zoom_scale = 4                  # ZOOM (mid) scale: detail-cell height per biome tile (aspect-corrected)
local_rows = 4                  # LOCAL (close) scale: ~this many biome tiles fill the screen height
cell_aspect = 2.0               # widen detail cells so a world tile reads ~square (both detail scales)
blend_strength = 0.85           # soften biome boundaries at detail scales (0 = crisp grid)
blend_scale = 2.5               # feature size (tiles) of the boundary-blend warp
road_half_width = 0.07          # road-bed half-width in tiles; the bed scales with zoom (a thin path, not a full tile)
road_min_rows = 1.0             # but never thinner than this many rows, so roads stay visible at zoom
road_max_rows = 2.0             # and never thicker, so a road through a site is a street and not a field
road_warp = 0.05                # organic wobble (tiles) of the road bed; 0 = dead-straight segments
road_smooth = 1.0               # rounds the road bed's corners (0 = sharp polyline, 1 = every bend a curve)
road_relax = 0.5                # pulls a bending tile toward its neighbours first, so bends cut deeper (0..1)
road_meander = 0.3              # slow long-scale drift (tiles) that keeps a long road from running pencil straight; 0 = off
road_meander_scale = 5.0        # tiles across a meander feature
# road_bed (the glyphs the detail-scale road bed is drawn with, by direction) and roads (the map-scale glyph set,
# including the diagonal and junction glyphs) are also tunable.
# road clutter (road_clutter, road_clutter_local), bridge_glyphs and the detail colours (detail_colors) are also
# tunable. See src/biomegen/config/defaults/render.py.
default_view = "onetoone"       # "fit" | "onetoone"
status_height = 15
panel_events = 4                # events the panel lists in the political view: the latest at the cursor, then its realm's
legend_rows = 3                 # rows the panel's legend always takes (it grows only when more is on screen)

[render.cache]
chunk_cols = 32                 # the explorer draws terrain once, in chunks of this many cells across
chunk_rows = 16                 # and this many down, and reuses them while panning
max_cells = 4000000             # cells kept (about 14 bytes each); the least recently shown go first
map_frames = 8                  # whole map-scale frames kept
prefetch_screens = 1.0          # while waiting for a key, draw the terrain this many screens round the view (0 = off)
prefetch_site_km = 600.0        # and build the plans of the sites within this many km of the cursor

[export]
dir = "./images"
cell_px = 12
png = true

[keys]
zoom = " "                # step OUT a zoom level (biome<->zoom, local->zoom)
local = "z"               # step IN a zoom level (biome->zoom->local). Set to " " only if your
                          # terminal distinguishes Shift+Space (most do not)
toggle_scale = "f"
floor_up = ">"             # cycle up a floor when standing on a multi-floor structure (e.g. dungeon)
floor_down = "<"           # cycle down a floor
refresh = "r"              # restart from the seed: the same world made again, view, edits and clock reset
cycle_view = "v"          # next view: terrain, elevation, temperature, rainfall
help = "?"                # show the key help
export_view = "e"
export_world = "E"
quit = "q"
# Chronicle pager (--chronicle on a terminal); arrows, WASD and HJKL scroll, space / Page Down page.
search = "/"              # ask for text to find; matches are highlighted
search_next = "n"
search_prev = "N"
filter_kind = "v"         # cycle the event-kind filter
filter_years = "y"        # ask for a year range, e.g. 100-300
filter_realm = "p"        # ask for a realm name to keep
filter_clear = "c"        # drop every filter
top = "g"
bottom = "G"

[controls]
fast_step = 8             # tiles moved per Shift+arrow (or capital WASD/HJKL)
pan = "edge"              # at the screen edge: "centre" re-centres on the cursor (half a screen), "edge" steps

[sim]
ticks_per_month = 30      # integer ticks in a month: the simulation's time base

[sim.playback]
ticks_per_second = 10.0   # ticks the explorer runs per second at normal speed (--sim)

# [tables.*] holds per-name attribute tables (biomes, relief, settlement tiers) read from
# src/biomegen/data/*.toml. Override any attribute of one row; the rest of the row is kept:
# [tables.biomes.desert]
# goods = "glass"
